[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PRIVATE_TARGET = "server"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  targetPort = 3002

[functions]
  directory = "netlify/functions"
  included_files = ["lib/**", "hooks/**", "stores/**", "types/**", "database/migrations/**"]

# ── CDN caching ──────────────────────────────────────────────────────────
# Netlify edge overrides origin headers. Order matters: most specific wins.
# Without these, Next.js defaults to private/no-store on dynamic routes.
#
# Assets: immutable (content-addressed by hash — must be specific to beat /*)
[[headers]]
  for = "/a/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# All public pages (homepage, static, dynamic CMS, EN versions)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, s-maxage=60, stale-while-revalidate=300"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Static assets: cache aggressively (swiper CSS, etc.)
[[headers]]
  for = "/swiper-minimal.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
