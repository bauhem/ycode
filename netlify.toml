[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PRIVATE_TARGET = "server"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  targetPort = 3002

[functions]
  directory = "netlify/functions"
  included_files = ["lib/**", "hooks/**", "stores/**", "types/**", "database/migrations/**"]

# ── CDN caching ──────────────────────────────────────────────────────────
# Netlify edge overrides origin headers. Order matters: most specific wins.
# Without these, Next.js defaults to private/no-store on dynamic routes.
#
# Assets: immutable (content-addressed by hash — must be specific to beat /*)
[[headers]]
  for = "/a/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# All public pages (homepage, static, dynamic CMS, EN versions)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, s-maxage=60, stale-while-revalidate=300"
